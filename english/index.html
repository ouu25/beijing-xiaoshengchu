<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>英语练习 · 五年级下</title>
<style>
:root {
  --bg: #fdf6ec;
  --card: #ffffff;
  --ink: #2d3142;
  --muted: #7a8290;
  --accent: #ff8c42;
  --accent2: #4ecdc4;
  --accent3: #6c8eef;
  --good: #4cb963;
  --bad:  #e76f51;
  --shadow: 0 4px 16px rgba(0,0,0,.08);
  --radius: 18px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "PingFang SC", "Helvetica Neue", sans-serif;
  font-size: 18px;
  line-height: 1.5;
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
}
input { user-select: text; -webkit-user-select: text; font-family: inherit; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* layout */
.app { max-width: 900px; margin: 0 auto; padding: 16px 20px 80px; }
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 4px 18px;
}
.topbar h1 {
  flex: 1; margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .3px;
}
.topbar .who {
  background: var(--card); padding: 8px 14px; border-radius: 999px;
  box-shadow: var(--shadow); font-size: 15px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
}
.topbar .who .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.topbar .back { font-size: 26px; padding: 4px 10px; border-radius: 12px; }
.topbar .back:active { background: rgba(0,0,0,.06); }

/* profiles */
.profiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }
.profile-card {
  background: var(--card); border-radius: var(--radius); padding: 28px 20px;
  box-shadow: var(--shadow); text-align: center; transition: transform .12s;
}
.profile-card:active { transform: scale(.96); }
.profile-card .avatar {
  width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 36px; font-weight: 700;
}
.profile-card .name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.profile-card .stat { font-size: 14px; color: var(--muted); }
.profile-card.add .avatar { background: #e8ecf3; color: #9aa3b2; }
.profile-card .del {
  position: absolute; top: 10px; right: 12px; font-size: 18px;
  color: var(--muted); padding: 4px 8px; border-radius: 8px;
}
.profile-card { position: relative; }

/* home modules */
.modules { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
@media (max-width: 700px) { .modules { grid-template-columns: 1fr; } }
.module {
  background: var(--card); border-radius: var(--radius); padding: 26px 20px;
  box-shadow: var(--shadow); text-align: left; transition: transform .12s;
  display: flex; flex-direction: column; gap: 6px; min-height: 150px;
}
.module:active { transform: scale(.98); }
.module .emo { font-size: 36px; }
.module .ttl { font-size: 20px; font-weight: 700; }
.module .sub { font-size: 14px; color: var(--muted); }
.module.a { border-top: 4px solid var(--accent); }
.module.b { border-top: 4px solid var(--accent2); }
.module.c { border-top: 4px solid var(--accent3); }

/* unit picker */
.units { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; }
.unit-btn {
  background: var(--card); border-radius: var(--radius); padding: 22px 16px;
  box-shadow: var(--shadow); font-size: 18px; font-weight: 700; text-align: left;
  transition: transform .12s;
}
.unit-btn:active { transform: scale(.96); }
.unit-btn .small { font-size: 13px; color: var(--muted); font-weight: 500; display: block; margin-top: 4px; }
.unit-btn .bar { height: 6px; background: #eee; border-radius: 3px; margin-top: 10px; overflow: hidden; }
.unit-btn .bar > i { display: block; height: 100%; background: var(--good); width: 0%; }

/* flashcard */
.fc-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  padding: 10px;
}
.fc-progress { font-size: 14px; color: var(--muted); }
.fc-card {
  width: 100%; max-width: 520px; aspect-ratio: 3 / 2;
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 20px; gap: 10px;
  transition: transform .25s;
}
.fc-card .w { font-size: 44px; font-weight: 700; }
.fc-card .ipa { font-size: 22px; color: var(--accent3); font-family: "Lucida Grande", "Charis SIL", serif; }
.fc-card .zh { font-size: 26px; font-weight: 600; color: #c45a35; }
.fc-card .play { font-size: 32px; padding: 6px 14px; border-radius: 999px; background: #fff4ea; }
.fc-card.flip { transform: rotateY(0); }
.fc-actions { display: flex; gap: 14px; margin-top: 4px; }
.btn {
  padding: 14px 26px; border-radius: 14px; font-size: 17px; font-weight: 600;
  background: var(--card); box-shadow: var(--shadow); min-width: 100px;
}
.btn.primary { background: var(--accent3); color: white; }
.btn.good { background: var(--good); color: white; }
.btn.warn { background: var(--accent); color: white; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--muted); }
.btn:active { transform: scale(.96); }

/* sentence list */
.sent-list { display: flex; flex-direction: column; gap: 12px; }
.sent {
  background: var(--card); border-radius: var(--radius); padding: 18px 18px;
  box-shadow: var(--shadow); display: flex; gap: 14px; align-items: flex-start;
}
.sent .play {
  background: var(--accent2); color: white; min-width: 50px; height: 50px;
  border-radius: 50%; font-size: 22px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sent .play.slow { background: #b4e5e0; color: var(--accent2); font-size: 16px; font-weight: 700; }
.sent .body { flex: 1; }
.sent .en { font-size: 19px; font-weight: 500; }
.sent .zh { font-size: 15px; color: var(--muted); margin-top: 6px; display: none; }
.sent.show .zh { display: block; }
.sent .toggle { font-size: 13px; color: var(--accent3); margin-top: 6px; font-weight: 600; }

/* spelling */
.sp-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  max-width: 600px; margin: 0 auto;
}
.sp-progress { font-size: 14px; color: var(--muted); }
.sp-card {
  width: 100%; background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 28px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
}
.sp-tag { font-size: 13px; color: var(--accent3); font-weight: 700; letter-spacing: 1px; }
.sp-prompt { font-size: 32px; font-weight: 700; text-align: center; min-height: 50px; }
.sp-prompt .play { font-size: 48px; }
.sp-prompt .blanks { letter-spacing: 8px; font-family: "SF Mono", Menlo, monospace; }
.sp-input {
  width: 100%; max-width: 420px; min-height: 72px; padding: 18px 22px; font-size: 28px;
  border: 2px solid #e8ecf3; border-radius: 14px; background: #fafbfd;
  text-align: center; letter-spacing: 4px; font-weight: 600;
  outline: none; transition: border-color .12s;
}
@media (pointer: coarse) { .sp-input { min-height: 96px; font-size: 32px; } }
.pencil-hint {
  display: none; align-items: center; gap: 6px;
  font-size: 13px; color: var(--muted); margin-top: 10px;
  background: #fff4ea; padding: 6px 12px; border-radius: 999px;
}
@media (pointer: coarse) { .pencil-hint { display: inline-flex; } }
.sp-input:focus { border-color: var(--accent3); }
.sp-input.ok { border-color: var(--good); background: #ecf8ef; }
.sp-input.bad { border-color: var(--bad); background: #fdecea; }
.sp-feedback { font-size: 18px; min-height: 28px; font-weight: 600; }
.sp-feedback.ok { color: var(--good); }
.sp-feedback.bad { color: var(--bad); }

/* scrambled letters */
.scramble-target {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  min-height: 60px; padding: 12px; background: #fafbfd; border-radius: 12px;
  width: 100%; min-width: 280px;
}
.scramble-pool { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.letter-tile {
  width: 48px; height: 56px; background: var(--accent3); color: white;
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 700; box-shadow: var(--shadow);
  transition: transform .12s;
}
.letter-tile:active { transform: scale(.92); }
.letter-tile.empty { background: #e8ecf3; box-shadow: none; }
.letter-tile.placed { background: var(--accent2); }

/* end summary */
.summary {
  background: var(--card); border-radius: var(--radius); padding: 26px;
  box-shadow: var(--shadow); text-align: center;
}
.summary .big { font-size: 48px; font-weight: 800; color: var(--accent); }
.summary .lbl { color: var(--muted); margin-bottom: 18px; }

/* modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex;
  align-items: center; justify-content: center; padding: 20px; z-index: 100;
}
.modal {
  background: var(--card); border-radius: var(--radius); padding: 24px;
  box-shadow: var(--shadow); width: 100%; max-width: 360px;
}
.modal h2 { margin: 0 0 14px; font-size: 20px; }
.modal input {
  width: 100%; padding: 12px 14px; font-size: 18px; border-radius: 12px;
  border: 2px solid #e8ecf3; outline: none; margin-bottom: 14px;
}
.modal input:focus { border-color: var(--accent3); }
.modal-row { display: flex; gap: 10px; justify-content: flex-end; }

/* badge on module */
.module .badge {
  position: absolute; top: 12px; right: 12px;
  background: var(--bad); color: white; font-size: 13px; font-weight: 700;
  padding: 2px 9px; border-radius: 999px; min-width: 22px; text-align: center;
}
.module { position: relative; }

/* sentence dictation diff */
.diff-row { display: flex; flex-wrap: wrap; gap: 6px; font-size: 20px; font-weight: 500; padding: 8px 0; }
.diff-row .w { padding: 2px 6px; border-radius: 6px; }
.diff-row .w.ok { background: #ecf8ef; color: var(--good); }
.diff-row .w.bad { background: #fdecea; color: var(--bad); text-decoration: line-through; }
.diff-row .w.miss { background: #fff4ea; color: var(--accent); border: 1px dashed var(--accent); }

.dict-textarea {
  width: 100%; min-height: 140px; padding: 16px 18px; font-size: 22px;
  border: 2px solid #e8ecf3; border-radius: 14px; background: #fafbfd;
  outline: none; font-family: inherit; line-height: 1.6; resize: vertical;
}
@media (pointer: coarse) { .dict-textarea { min-height: 200px; font-size: 26px; line-height: 1.7; } }
.dict-textarea:focus { border-color: var(--accent3); }

/* error notebook list */
.err-item {
  background: var(--card); border-radius: var(--radius); padding: 16px 18px;
  box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px;
}
.err-item .box-tag {
  background: #fff4ea; color: var(--accent); padding: 4px 10px; border-radius: 999px;
  font-size: 13px; font-weight: 700;
}
.err-item .body { flex: 1; }
.err-item .body .top { font-size: 17px; font-weight: 600; }
.err-item .body .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

/* nav row in flashcard */
.fc-nav { display: flex; align-items: center; gap: 12px; }
.fc-nav .nav-btn {
  width: 56px; height: 56px; border-radius: 50%; background: var(--card);
  box-shadow: var(--shadow); font-size: 24px;
}
.fc-nav .nav-btn:active { transform: scale(.92); }
.fc-nav .nav-btn:disabled { opacity: .3; }

.hidden { display: none !important; }
</style>
</head>

function bumpScore(word, delta) {
  const name = STORAGE.current();
  if (!name) return;
  const s = STORAGE.score(name);
  s[word] = Math.max(-5, Math.min(10, (s[word] || 0) + delta));
  STORAGE.setScore(name, s);
}

// ============ ERROR NOTEBOOK (Leitner spaced repetition) ============
const SRS_INTERVALS_DAYS = [0, 1, 2, 4, 7, 14]; // box 1..5, +30 for box 6 (mastered)
const DAY_MS = 24 * 60 * 60 * 1000;
function getWrong() {
  const name = STORAGE.current();
  return JSON.parse(localStorage.getItem("ep:wrong:" + name) || "{}");
}
function setWrong(w) {
  const name = STORAGE.current();
  localStorage.setItem("ep:wrong:" + name, JSON.stringify(w));
}
function srsKey(kind, id) { return kind + ":" + id; }
// kind: "word" | "sent"; id: word string or "u<n>-<i>" for sentences
function addWrong(kind, id, displayText, hint) {
  const w = getWrong();
  const k = srsKey(kind, id);
  const now = Date.now();
  if (w[k]) {
    w[k].box = 1;
    w[k].dueAt = now;
    w[k].wrongCount = (w[k].wrongCount || 0) + 1;
  } else {
    w[k] = { kind, id, text: displayText, hint, box: 1, dueAt: now, wrongCount: 1, addedAt: now };
  }
  setWrong(w);
}
function srsRight(kind, id) {
  const w = getWrong();
  const k = srsKey(kind, id);
  if (!w[k]) return;
  w[k].box = Math.min(6, w[k].box + 1);
  if (w[k].box >= 6) { delete w[k]; }
  else { w[k].dueAt = Date.now() + SRS_INTERVALS_DAYS[w[k].box] * DAY_MS; }
  setWrong(w);
}
function srsWrong(kind, id) {
  const w = getWrong();
  const k = srsKey(kind, id);
  if (!w[k]) return;
  w[k].box = 1;
  w[k].dueAt = Date.now();
  w[k].wrongCount = (w[k].wrongCount || 0) + 1;
  setWrong(w);
}
function dueItems() {
  const w = getWrong();
  const now = Date.now();
  return Object.values(w).filter(it => it.dueAt <= now)
    .sort((a, b) => a.dueAt - b.dueAt);
}
function totalWrong() { return Object.keys(getWrong()).length; }

function unitProgress(unit) {
  const name = STORAGE.current();
  if (!name) return 0;
  const s = STORAGE.score(name);
  const words = WORDS.filter(w => w.unit === unit);
  if (!words.length) return 0;
  const known = words.filter(w => (s[w.word] || 0) >= 3).length;
  return Math.round(known / words.length * 100);
}

// ============ TTS ============
let voiceCache = null;
// Quality keywords (case-insensitive substring match against name + voiceURI)
const QUALITY_HINTS = [
  { re: /neural|wavenet|natural|premium|enhanced|siri/i, score: 1000 },
  { re: /\(enhanced\)|\(premium\)/i, score: 1200 },
];
// Known-good Apple / Google English voice names (clear & natural)
const GOOD_NAMES = ["Samantha","Karen","Daniel","Moira","Tessa","Serena","Allison","Ava","Susan","Kate","Oliver","Stephanie","Aaron","Nicky","Evan","Joelle","Zoe","Isha","Arthur","Martha","Jamie"];
// Joke / low-quality Apple voices to penalize
const BAD_NAMES = ["Albert","Bad News","Bahh","Bells","Boing","Bubbles","Cellos","Deranged","Fred","Good News","Hysterical","Jester","Junior","Kathy","Organ","Pipe","Princess","Ralph","Trinoids","Whisper","Zarvox","Wobble","Superstar","Grandma","Grandpa","Rocko","Reed","Shelley","Sandy","Eddy","Flo"];

function scoreVoice(v) {
  if (!/^en/i.test(v.lang)) return -Infinity;
  let s = 0;
  const blob = (v.name + " " + (v.voiceURI || "")).toLowerCase();
  QUALITY_HINTS.forEach(h => { if (h.re.test(blob)) s += h.score; });
  if (GOOD_NAMES.some(n => v.name.startsWith(n))) s += 300;
  if (BAD_NAMES.some(n => v.name.startsWith(n))) s -= 800;
  if (/^en-GB/i.test(v.lang)) s += 60;
  else if (/^en-US/i.test(v.lang)) s += 40;
  else if (/^en-AU/i.test(v.lang)) s += 30;
  if (v.localService) s += 20;
  if (v.default) s += 5;
  // Microsoft web-based voices on Edge tend to be robotic unless they have "Natural" suffix
  if (/microsoft/i.test(blob) && !/natural/i.test(blob)) s -= 200;
  return s;
}

function listEnVoices() {
  return speechSynthesis.getVoices()
    .filter(v => /^en/i.test(v.lang))
    .map(v => ({ v, score: scoreVoice(v) }))
    .sort((a, b) => b.score - a.score)
    .map(x => x.v);
}

function pickVoice() {
  if (voiceCache) return voiceCache;
  const saved = localStorage.getItem("ep:voiceURI");
  const vs = speechSynthesis.getVoices();
  if (saved) {
    const hit = vs.find(v => v.voiceURI === saved);
    if (hit) { voiceCache = hit; return hit; }
  }
  voiceCache = listEnVoices()[0] || null;
  return voiceCache;
}

if ("speechSynthesis" in window) {
  speechSynthesis.onvoiceschanged = () => { voiceCache = null; pickVoice(); };
}

// iOS Safari needs a user-gesture-triggered speak() to unlock the engine.
// We fire a silent utterance on the first touch/click to prime it.
let speechUnlocked = false;
function unlockSpeech() {
  if (speechUnlocked || !("speechSynthesis" in window)) return;
  speechUnlocked = true;
  try {
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    speechSynthesis.speak(u);
  } catch (e) {}
}
if ("speechSynthesis" in window) {
  document.addEventListener("touchstart", unlockSpeech, { once: true, passive: true });
  document.addEventListener("click", unlockSpeech, { once: true });
  document.addEventListener("pointerdown", unlockSpeech, { once: true });
}

function speak(text, rate = 1) {
  if (!("speechSynthesis" in window)) return;
  unlockSpeech();
  const fire = () => {
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) u.voice = v;
    u.lang = v ? v.lang : "en-GB";
    // Slightly slower default reads more clearly for kids
    u.rate = rate * 0.95;
    u.pitch = 1.02;
    speechSynthesis.speak(u);
  };
  // On iOS, cancel() immediately followed by speak() can silently drop the second call.
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(fire, 80);
  } else {
    fire();
  }
}

VIEWS.flash = (app, { unit }) => {

  pool.sort((a, b) => (score[a.word] || 0) - (score[b.word] || 0) + (Math.random() - .5) * .1);

    if (idx >= pool.length) return showDone();

VIEWS.spell = (app, { unit }) => {
  const me = STORAGE.current();
  const score = STORAGE.score(me);
  // pool: only words made of letters (and simple multi-words)
  let pool = WORDS.filter(w => (unit === 0 || w.unit === unit) && /^[A-Za-z][A-Za-z\s]*$/.test(w.word));
  // priority: less-known words first
  pool.sort((a, b) => (score[a.word] || 0) - (score[b.word] || 0) + (Math.random() - .5) * .3);
  const sizePref = STORAGE.quizSize();
  let cap;
  if (sizePref === "all") cap = pool.length;
  else cap = Math.min(parseInt(sizePref, 10) || 10, pool.length);
  const items = pool.slice(0, cap);
  if (items.length === 0) {
    app.innerHTML = `<div class="topbar"><button class="back" onclick="go('units-spell')">‹</button><h1>没题可练</h1></div>`;
    return;
  }
  // assign random mode per item
  const MODES = ["dictate", "zh2en", "scramble", "fill"];
  items.forEach(it => { it._mode = MODES[Math.floor(Math.random() * MODES.length)]; });
  let idx = 0, correct = 0;

  function frame() {
    if (idx >= items.length) return showDone();
    const it = items[idx];
    const m = it._mode;
    let promptHtml = "", tag = "";
    if (m === "dictate") {
      tag = "🎧 听写";
      promptHtml = `<button class="play" id="play" style="background:transparent;font-size:64px;">🔊</button><div style="font-size:14px;color:var(--muted)">点喇叭听单词</div>`;
    } else if (m === "zh2en") {
      tag = "🀄️ 中译英";
      promptHtml = `<div>${it.zh}</div>`;
    } else if (m === "scramble") {
      tag = "🔤 字母排序";
      // handled below specially
    } else if (m === "fill") {
      tag = "➖ 填空";
      const ws = it.word;
      const blanks = ws.split("").map((c, i) => {
        if (c === " ") return " ";
        // hide ~40% of letters
        return Math.random() < 0.45 ? `_` : c;
      }).join("");
      promptHtml = `<div class="blanks">${blanks}</div><div style="font-size:14px;color:var(--muted)">${it.zh}</div>`;
    }

    if (m === "scramble") {
      // scramble UI
      const letters = it.word.split("");
      const shuffled = letters.slice().sort(() => Math.random() - .5);
      app.innerHTML = `
        <div class="topbar">
          <button class="back" id="back">‹</button>
          <h1>拼写 ${unit ? "· U" + unit : ""}</h1>
          <button class="who" id="who"><span class="dot"></span>${me}</button>
        </div>
        <div class="sp-wrap">
          <div class="sp-progress">${idx + 1} / ${items.length} · ✅ ${correct}</div>
          <div class="sp-card">
            <div class="sp-tag">${tag}</div>
            <div style="font-size:18px;color:var(--muted)">${it.zh}</div>
            <div class="scramble-target" id="target"></div>
            <div class="scramble-pool" id="pool"></div>
            <div class="sp-feedback" id="fb"></div>
            <button class="btn ghost" id="reset">重置</button>
          </div>
          <button class="btn primary" id="check">检查</button>
        </div>
      `;
      document.getElementById("back").onclick = () => go("units-spell");
      document.getElementById("who").onclick = () => go("profiles");
      const target = document.getElementById("target");
      const pool = document.getElementById("pool");
      const placed = []; // array of {letter, fromIdx}
      const used = new Array(shuffled.length).fill(false);

      function renderScr() {
        target.innerHTML = "";
        const slotCount = letters.length;
        for (let i = 0; i < slotCount; i++) {
          const t = document.createElement("button");
          t.className = "letter-tile " + (placed[i] ? "placed" : "empty");
          t.textContent = placed[i] ? placed[i].letter : "";
          t.onclick = () => {
            if (placed[i]) {
              used[placed[i].fromIdx] = false;
              placed[i] = null;
              renderScr();
            }
          };
          target.appendChild(t);
        }
        pool.innerHTML = "";
        shuffled.forEach((ltr, i) => {
          if (used[i]) return;
          const t = document.createElement("button");
          t.className = "letter-tile";
          t.textContent = ltr;
          t.onclick = () => {
            const empty = placed.findIndex(p => !p);
            const firstEmpty = empty === -1 ? placed.length : empty;
            if (firstEmpty < letters.length) {
              placed[firstEmpty] = { letter: ltr, fromIdx: i };
              used[i] = true;
              renderScr();
            }
          };
          pool.appendChild(t);
        });
      }
      renderScr();
      document.getElementById("reset").onclick = () => {
        for (let i = 0; i < placed.length; i++) placed[i] = null;
        for (let i = 0; i < used.length; i++) used[i] = false;
        renderScr();
        document.getElementById("fb").className = "sp-feedback"; document.getElementById("fb").textContent = "";
      };
      document.getElementById("check").onclick = () => {
        const ans = placed.map(p => p ? p.letter : "_").join("");
        const fb = document.getElementById("fb");
        if (ans === it.word) {
          fb.className = "sp-feedback ok"; fb.textContent = "✓ 对啦！";
          bumpScore(it.word, +1); correct++;
          srsRight("word", it.word);
          setTimeout(() => { idx++; frame(); }, 800);
        } else {
          fb.className = "sp-feedback bad"; fb.textContent = `✗ 是 ${it.word}`;
          bumpScore(it.word, -1);
          addWrong("word", it.word, it.word, it.zh);
          setTimeout(() => { idx++; frame(); }, 1600);
        }
      };
      return;
    }

    // text input modes
    app.innerHTML = `
      <div class="topbar">
        <button class="back" id="back">‹</button>
        <h1>拼写 ${unit ? "· U" + unit : ""}</h1>
        <button class="who" id="who"><span class="dot"></span>${me}</button>
      </div>
      <div class="sp-wrap">
        <div class="sp-progress">${idx + 1} / ${items.length} · ✅ ${correct}</div>
        <div class="sp-card">
          <div class="sp-tag">${tag}</div>
          <div class="sp-prompt">${promptHtml}</div>
          <input class="sp-input" id="in" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="拼出来">
          <div class="pencil-hint">✏️ 可以用 Apple Pencil 直接在框里写</div>
          <div class="sp-feedback" id="fb"></div>
        </div>
        <button class="btn primary" id="check">检查</button>
      </div>
    `;
    document.getElementById("back").onclick = () => go("units-spell");
    document.getElementById("who").onclick = () => go("profiles");
    const input = document.getElementById("in");
    const fb = document.getElementById("fb");
    setTimeout(() => input.focus(), 80);
    if (m === "dictate") {
      document.getElementById("play").onclick = () => speak(it.word);
      setTimeout(() => speak(it.word), 250);
    }
    function doCheck() {
      const ans = input.value.trim().toLowerCase();
      const correctAns = it.word.toLowerCase();
      if (ans === correctAns) {
        input.classList.add("ok"); fb.className = "sp-feedback ok"; fb.textContent = "✓ 对啦！";
        bumpScore(it.word, +1); correct++;
        srsRight("word", it.word);
        setTimeout(() => { idx++; frame(); }, 800);
      } else if (ans === "") {
        fb.className = "sp-feedback bad"; fb.textContent = "先写点东西嘛 :)";
      } else {
        input.classList.add("bad"); fb.className = "sp-feedback bad"; fb.textContent = `✗ 是 ${it.word}`;
        bumpScore(it.word, -1);
        addWrong("word", it.word, it.word, it.zh);
        setTimeout(() => { idx++; frame(); }, 1800);
      }
    }
    input.onkeydown = (e) => { if (e.key === "Enter") doCheck(); };
    document.getElementById("check").onclick = doCheck;
  }
  function showDone() {
    const pct = Math.round(correct / items.length * 100);
    app.innerHTML = `
      <div class="topbar">
        <button class="back" id="back">‹</button>
        <h1>完成！</h1>
        <button class="who" id="who"><span class="dot"></span>${me}</button>
      </div>
      <div class="summary">
        <div class="big">${correct} / ${items.length}</div>
        <div class="lbl">正确率 ${pct}% ${pct >= 80 ? "🌟 真棒！" : pct >= 60 ? "👍 继续加油" : "💪 多练几遍"}</div>
        <button class="btn primary" id="again">再来一组</button>
        <button class="btn ghost" id="home">回首页</button>
      </div>

    document.getElementById("back").onclick = () => go("units-spell");

// ============ VIEW: SENTENCE DICTATION ============
function tokenize(s) {
  return s.toLowerCase().replace(/[^a-z0-9'\s]/g, " ").split(/\s+/).filter(Boolean);
}
// word-level LCS diff → array of {word, status: ok|miss|bad}
function diffWords(expected, actual) {
  const E = tokenize(expected), A = tokenize(actual);
  const n = E.length, m = A.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) {
    dp[i][j] = E[i-1] === A[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
  }
  const out = [];
  let i = n, j = m;
  const ops = [];
  while (i > 0 && j > 0) {
    if (E[i-1] === A[j-1]) { ops.push({ word: E[i-1], status: "ok" }); i--; j--; }
    else if (dp[i-1][j] >= dp[i][j-1]) { ops.push({ word: E[i-1], status: "miss" }); i--; }
    else { ops.push({ word: A[j-1], status: "bad" }); j--; }
  }
  while (i > 0) { ops.push({ word: E[i-1], status: "miss" }); i--; }
  while (j > 0) { ops.push({ word: A[j-1], status: "bad" }); j--; }
  return ops.reverse();
}
function sentId(unit, idx) { return "u" + unit + "-" + idx; }

      const ans = input.value.trim();
      if (!ans) return;
      const diff = diffWords(s.en, ans);
      const allOk = diff.every(d => d.status === "ok");
      const html = `
        <div class="diff-row">${diff.map(d => `<span class="w ${d.status}">${d.word}</span>`).join("")}</div>
        <div style="font-size:14px;color:var(--muted);margin-top:6px;">原句：${s.en}</div>
        <div style="font-size:14px;color:var(--muted);">${s.zh}</div>
        <div style="margin-top:14px;display:flex;gap:10px;">
          <button class="btn ghost" id="replay">🔊 再听一遍</button>
          <button class="btn primary" id="next">${idx + 1 >= items.length ? "完成" : "下一题"}</button>
        </div>
      `;
      document.getElementById("result").innerHTML = html;
      if (allOk) {
        correct++;
        srsRight("sent", s._id);
      } else {
        addWrong("sent", s._id, s.en, s.zh);
      }
      document.getElementById("replay").onclick = () => speak(s.en, 0.8);
      document.getElementById("next").onclick = () => { idx++; frame(); };
    };
  }
  function showDone() {
    const pct = Math.round(correct / items.length * 100);
    app.innerHTML = `
      <div class="topbar">
        <button class="back" id="back">‹</button>
        <h1>完成！</h1>
        <button class="who" id="who"><span class="dot"></span>${me}</button>
      </div>
      <div class="summary">
        <div class="big">${correct} / ${items.length}</div>
        <div class="lbl">正确率 ${pct}% ${pct >= 80 ? "🌟" : pct >= 60 ? "👍" : "💪"}</div>
        <button class="btn primary" id="again">再来一组</button>
        <button class="btn ghost" id="home">回首页</button>
      </div>
    `;
    document.getElementById("back").onclick = () => go("units-dict");
    document.getElementById("who").onclick = () => go("profiles");
    document.getElementById("again").onclick = () => go("dict", { unit });
    document.getElementById("home").onclick = () => go("home");
  }
  frame();
};

// ============ VIEW: ERROR NOTEBOOK ============
VIEWS.errors = (app) => {
  const me = STORAGE.current();
  const due = dueItems();
  const all = Object.values(getWrong()).sort((a, b) => a.dueAt - b.dueAt);

  if (all.length === 0) {
    app.innerHTML = `
      <div class="topbar">
        <button class="back" id="back">‹</button>
        <h1>错题本</h1>
        <button class="who" id="who"><span class="dot"></span>${me}</button>
      </div>
      <div class="summary">
        <div class="big">✨</div>
        <div class="lbl">还没有错题，好厉害！</div>
        <button class="btn ghost" id="home">回首页</button>
      </div>
    `;
    document.getElementById("back").onclick = () => go("home");
    document.getElementById("who").onclick = () => go("profiles");
    document.getElementById("home").onclick = () => go("home");
    return;
  }

  if (due.length > 0) return reviewMode(due);
  return listMode(all);

  function startPractice(items) {
    if (!items.length) return;
    return reviewMode(items.slice());
  }

  function reviewMode(queue) {
    let i = 0, right = 0;
    function showItem() {
      if (i >= queue.length) return doneReview();
      const it = queue[i];
      const isWord = it.kind === "word";
      app.innerHTML = `
        <div class="topbar">
          <button class="back" id="back">‹</button>
          <h1>错题复习</h1>
          <button class="who" id="who"><span class="dot"></span>${me}</button>
        </div>
        <div class="sp-wrap">
          <div class="sp-progress">${i + 1} / ${queue.length} · 第 ${it.box} 盒</div>
          <div class="sp-card">
            <div class="sp-tag">${isWord ? "🔤 还记得这个词吗" : "🗣️ 听句子默写"}</div>
            ${isWord
              ? `<div style="font-size:34px;font-weight:700;margin:14px 0;">${it.hint || ""}</div>
                 <div style="font-size:14px;color:var(--muted);">先想一想英文怎么写</div>`
              : `<div style="display:flex;gap:10px;justify-content:center;margin:10px 0;">
                   <button class="play" id="play" style="background:transparent;font-size:48px;">🔊</button>
                   <button class="play slow" id="slow">慢速</button>
                 </div>
                 <div style="font-size:14px;color:var(--muted);">${it.hint || ""}</div>`
            }
            <div id="reveal" class="hidden" style="margin-top:14px;font-size:24px;font-weight:600;color:var(--accent3);">${it.text}</div>
            <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
              <button class="btn ghost" id="show">显示答案</button>
              <button class="btn warn" id="no">还不会</button>
              <button class="btn good" id="yes">会了</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById("back").onclick = () => go("home");
      document.getElementById("who").onclick = () => go("profiles");
      if (!isWord) {
        document.getElementById("play").onclick = () => speak(it.text, 1);
        document.getElementById("slow").onclick = () => speak(it.text, 0.6);
        setTimeout(() => speak(it.text, 1), 300);
      } else {
        setTimeout(() => speak(it.text, 1), 200);
      }
      document.getElementById("show").onclick = () => {
        document.getElementById("reveal").classList.remove("hidden");
        if (isWord) speak(it.text, 1);
      };
      document.getElementById("yes").onclick = () => { srsRight(it.kind, it.id); right++; i++; showItem(); };
      document.getElementById("no").onclick  = () => { srsWrong(it.kind, it.id);            i++; showItem(); };
    }
    function doneReview() {
      app.innerHTML = `
        <div class="topbar">
          <button class="back" id="back">‹</button>
          <h1>复习完成</h1>
          <button class="who" id="who"><span class="dot"></span>${me}</button>
        </div>
        <div class="summary">
          <div class="big">${right} / ${queue.length}</div>
          <div class="lbl">今天的错题都过完啦</div>
          <button class="btn primary" id="home">回首页</button>
          <button class="btn ghost" id="list">看全部错题</button>
        </div>
      `;
      document.getElementById("back").onclick = () => go("home");
      document.getElementById("who").onclick = () => go("profiles");
      document.getElementById("home").onclick = () => go("home");
      document.getElementById("list").onclick = () => listMode(Object.values(getWrong()).sort((a, b) => a.dueAt - b.dueAt));
    }
    showItem();
  }

  function listMode(items) {
    app.innerHTML = `
      <div class="topbar">
        <button class="back" id="back">‹</button>
        <h1>错题本 · 共 ${items.length}</h1>
        <button class="who" id="who"><span class="dot"></span>${me}</button>
      </div>
      ${items.length > 0 ? `
        <div style="padding:0 18px 12px;">
          <button class="btn primary" id="practiceAll" style="width:100%;">🔁 全部重练 (${items.length})</button>
        </div>
      ` : ""}
      <div class="sent-list" id="list" style="padding:0 18px 24px;"></div>
    `;
    document.getElementById("back").onclick = () => go("home");
    document.getElementById("who").onclick = () => go("profiles");
    if (items.length > 0) {
      document.getElementById("practiceAll").onclick = () => startPractice(items);
    }
    const wrap = document.getElementById("list");
    if (items.length === 0) {
      wrap.innerHTML = `<div style="text-align:center;color:var(--muted);padding:40px 0;">没有错题</div>`;
      return;
    }
    items.forEach(it => {
      const dueIn = Math.ceil((it.dueAt - Date.now()) / DAY_MS);
      const dueLabel = dueIn <= 0 ? "今天到期" : `${dueIn} 天后`;
      const el = document.createElement("div");
      el.className = "err-item";
      el.innerHTML = `
        <div class="box-tag">第 ${it.box} 盒</div>
        <div class="body">
          <div class="top">${it.text}</div>
          <div class="sub">${it.hint || ""} · 错 ${it.wrongCount} 次 · ${dueLabel}</div>
        </div>
        <button class="play" data-play="1" style="background:transparent;font-size:22px;">🔊</button>
        <button class="play" data-practice="1" style="background:transparent;font-size:22px;" title="单独练这条">✍️</button>
      `;
      el.querySelector("[data-play]").onclick = () => speak(it.text, 0.9);
      el.querySelector("[data-practice]").onclick = () => startPractice([it]);
      wrap.appendChild(el);
    });
  }
};

// ============ VIEW: MASTERED WORDS ============
VIEWS.mastered = (app) => {
  const me = STORAGE.current();
  const score = STORAGE.score(me);
  const masteredByUnit = {};
  UNITS.forEach(u => { masteredByUnit[u] = []; });
  WORDS.forEach(w => {
    if ((score[w.word] || 0) >= 3 && masteredByUnit[w.unit]) {
      masteredByUnit[w.unit].push(w);
    }
  });
  const total = Object.values(masteredByUnit).reduce((s, arr) => s + arr.length, 0);
  app.innerHTML = `
    <div class="topbar">
      <button class="back" id="back">‹</button>
      <h1>已掌握 · 共 ${total} 词</h1>
      <button class="who" id="who"><span class="dot"></span>${me}</button>
    </div>
    <div class="sent-list" id="list" style="padding:0 18px 24px;"></div>
  `;
  document.getElementById("back").onclick = () => go("home");
  document.getElementById("who").onclick = () => go("profiles");
  const wrap = document.getElementById("list");
  if (total === 0) {
    wrap.innerHTML = `<div style="text-align:center;color:var(--muted);padding:40px 0;">还没有已掌握的词，去背单词试试 →</div>`;
    return;
  }
  UNITS.forEach(u => {
    const arr = masteredByUnit[u];
    if (!arr.length) return;
    const header = document.createElement("div");
    header.style.cssText = "font-weight:700;margin:14px 0 8px;color:var(--muted);font-size:14px;";
    header.textContent = `Unit ${u} · ${arr.length} 词`;
    wrap.appendChild(header);
    arr.forEach(w => {
      const el = document.createElement("div");
      el.className = "err-item";
      el.innerHTML = `
        <div class="body">
          <div class="top">${w.word}</div>
          <div class="sub">${w.ipa} · ${w.zh}</div>
        </div>
        <button class="play" data-play="1" style="background:transparent;font-size:22px;">🔊</button>
      `;
      el.querySelector("[data-play]").onclick = () => speak(w.word, 0.9);
      wrap.appendChild(el);
    });
  });
};
